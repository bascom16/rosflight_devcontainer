[project]
name = "sim-launcher"
version = "0.1.0"
description = "Browser GUI for starting and stopping ROSflight simulations and missions"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
